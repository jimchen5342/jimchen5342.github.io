<script type="module">
  window.onload = async function(){
		let email =  window.localStorage["email"];
		let password = window.localStorage["password"];
		if(location.href.indexOf("?") > -1) {
			let s = location.href.substr(location.href.indexOf("?") + 1);
			let arr = s.split("&");
      for (let index = 0; index < arr.length; index++) {
        console.log(arr[index])
        const element = arr[index].split("=");
        window.localStorage[element[0]] = element[1];
      }
		}

    if(typeof window.localStorage["email"] == "string" && window.localStorage["email"].length > 0 ) {
			try {
				FireStore.initial();
				await FireStore.signIn(window.localStorage["email"], window.localStorage["password"])
				console.log("FireStore.mail: " + FireStore.mail() + "\n  id: " + FireStore.uid())

        // FireStore.setSetting("test", {a: 1, b: 2});
        // await setData("lesson", {a: 1, b: 2});
        // let result = await getData("lesson");
        // console.log("getData: " + JSON.stringify(result));
			} catch(e) {
				console.log(e)
				// alert(e.message);
			}
		} else {
			email = "";
		}
  }

  async function getData(key){
			try {
				let snapshot1 = await FireStore.db.collection("japan").doc(key)
          .get();
        return snapshot1.data();
      } catch(e) {
        // console.log(e)
        // vm.showMessage(typeof e == "object" ? JSON.stringify(e) : e);
      }
    }

  async function setData(key, json){
    let ref = FireStore.db.collection("japan").doc(key);
    try {
      let x = await ref.set(json,{merge: true});
        console.log("setData: " + JSON.stringify(x));
        return x;
    } catch(e) {
      console.log(e)
      throw e;
    }
  }
</script>
