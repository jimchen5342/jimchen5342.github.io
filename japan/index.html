<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>大家的日本語</title>
  
  <!-- 引入 View UI Plus 樣式表 -->
  <link rel="stylesheet" href="../cdn/iview/styles/viewuiplus.css">
  
  <style>
    * {
			-webkit-box-sizing: border-box;
			-moz-box-sizing: border-box;
			box-sizing: border-box;
			/* user-select: none; */
			font-family: 'Times New Roman', 'Helvetica Neue', 微軟正黑體, 'Microsoft Jhenghei', Helvetica, Arial, sans-serif;
			font-size: 1rem;
		}
    body {
      margin: 0;
      padding: 0;
      /* background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); */
      min-height: 100vh;
      font-family: 'Outfit', 'Noto Sans TC', sans-serif;
      color: #333;
    }
    
    #app {
      padding: 5px;
      /* max-width: 1200px; */
      margin: 0 auto;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    .header-panel {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      padding-bottom: 4px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.2);
      gap: 20px;
    }
    
    .control-item {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .card-box {
      flex: 1 1 auto;
      display: flex;
      flex-wrap: wrap;
      min-height: 360px;
      padding: 0px 3px 6px 3px;
      overflow: auto;
    }
    .card {
			border-radius: 5px;
			border: 2px #eee solid;
			padding: 5px;
			display: flex;
			flex-direction: row;
		}
    .active {
      border-color: #2d8cf0;
    }
    span.accent {
			margin-top: 2px;
			border-top: 1px solid #D3D3D3;
      border-left: 1px solid #D3D3D3;
      border-right: 1px solid #D3D3D3;
			padding: 2px 2px 0 2px;
			font-size: inherit;
		}
    span.accent-bottom  {
      border-bottom: 1px solid #D3D3D3;
			padding: 0px 2px 0px 2px;
			font-size: inherit;
    }
  </style>
  <!--
  <script src="https://www.gstatic.com/firebasejs/7.2.1/firebase-app.js"></script>
	<script src="https://www.gstatic.com/firebasejs/7.2.1/firebase-firestore.js"></script>
	<script src="https://www.gstatic.com/firebasejs/7.2.1/firebase-auth.js"></script>
  <script src="../utility/fireStore.js"></script>
  -->
  <script src="../utility/system.js"></script>
	<script src="../utility/loadScript.js"></script>

  <!-- 引入 Vue 3 及 View UI Plus 核心 JavaScript -->
  <script src="../cdn/vue3.js"></script>
  <script src="../cdn/iview/viewuiplus.min.js"></script>
  <script>
    // 確保 window.viewuiplus 存在以供語系檔註冊
    window.viewuiplus = window.ViewUIPlus;
  </script>

</head>
<body>
  <div id="app">
    <div class="header-panel" style="width: 100%;">
      <div class="control-item">
        <i-select v-model="selectedLesson" size="large" style="width: 120px" @on-change="onLessonChange">
          <i-option v-for="item in lessons" :value="item" :key="item">{{ item }}</i-option>
        </i-select>
      </div>
      <div class="control-item">
        <radio-group v-model="selectedType" type="button" button-style="solid" size="large" @on-change="onTypeChange" @update:modelValue="onTypeChange">
          <radio label="單字">單字</radio>
          <radio label="補充">補充</radio>
        </radio-group>
      </div>
      <div style="flex: 1;"></div>
      <div class="control-item" v-if="cardWidth > 600">
        <i-button type="primary" @click="printLessonA4" size="large">列印 A4</i-button>
        <i-button type="primary" @click="printLessonA5" size="large">列印 A5</i-button>
      </div>
    </div>
    <div id="cardbox" class="card-box">

    </div>
  </div>
</body>
<script type="module">
  import zhTW from '../cdn/iview/locale/zh-TW.js';
  import TTX from '../utility/TTX.js';
  import RenderCard from './renderCard.js'
  // https://iviewui.com/view-ui-plus/guide/introduce

  const { createApp, ref, onMounted, onBeforeUnmount } = Vue;
  let resizeId = null;

  const isSafariBrowser = () => {
    const ua = navigator.userAgent || '';
    const vendor = navigator.vendor || '';
    return /Safari/.test(ua) && /Apple Computer/.test(vendor) && !/(CriOS|Chrome|Chromium|Edg|OPR|Opera)/.test(ua);
  };

  const app = createApp({
    setup() {
      const savedIndex = window.localStorage.getItem('大家的日本語-index');
      let parsedIndex = null;
      try {
        parsedIndex = savedIndex ? JSON.parse(savedIndex) : null;
      } catch (e) {
        parsedIndex = null;
      }

      const selectedLesson = ref(parsedIndex?.selectedLesson || '第 01 課');
      const lessons = ref([]);
      const selectedType = ref(parsedIndex?.selectedType || '單字');
      const selectedCard = ref(parsedIndex?.selectedCard || null);
      const wordList = ref([]);
      const loading = ref(false);
      const cardWidth = ref(0);

      const onResize = () => {
        clearInterval(resizeId)
        const cardbox = document.querySelector('#cardbox');
        if (cardbox) {
          if(cardWidth.value != cardbox.clientWidth) {
            resizeId = setInterval(() => {
              clearInterval(resizeId)
              renderLesson();
            }, 600);
          }
        }
      };

      const onKeyDown = (event) => {
        let o = document.activeElement, 
          pk = navigator.userAgent.indexOf('Macintosh') > -1 ? event.metaKey : event.ctrlKey,
          ck = navigator.userAgent.indexOf('Macintosh') > -1  ? event.ctrlKey : event.altKey,
          ok = navigator.userAgent.indexOf('Macintosh') > -1  ? event.altKey : false,
          sk = event.shiftKey, 
          code = event.keyCode;
      
        if(code == 37 || code == 39) {
          let arr = document.querySelectorAll(".card"), index = 0;
          for(let i = 0; i < arr.length; i++) {
            if(arr[i].id == selectedCard.value) {
              index = i;
              break;
            }
          }

          if(index > -1) {
            index += (code == 37 ? -1 : 1)
          }
          if(index == -1 || index == arr.length)
            index = 0;
          changeActive(arr[index])
        } else if(code == 32) { // 空白鍵
          if(typeof selectedCard.value == "string") {
            let el = document.querySelector("#" + selectedCard.value);
            if (el) {
              changeActive(el, 3)
            }
          }
        } else {
          return;
        }
        event.preventDefault();
        event.stopImmediatePropagation();
        event.stopPropagation();
      }

      const loadLesson = async () => {
        loading.value = true;
        try {
          const fileName = `./大家的日本語/${selectedLesson.value}.json`;
          const response = await fetch(encodeURI(fileName));
          if (!response.ok) {
            throw new Error(`Fetch failed: ${response.status} ${response.statusText}`);
          }
          wordList.value = await response.json();
          renderLesson();
        } catch (e) {
          console.error(e);
          window.ViewUIPlus.Message.error('載入課文失敗');
        } finally {
          loading.value = false;
        }
      };

      const loadLessons = async () => {
        try {
          const fileName = `./大家的日本語/lessons.json`;
          const resp = await fetch(encodeURI(fileName));
          if (!resp.ok) throw new Error(`Fetch failed: ${resp.status} ${resp.statusText}`);
          const data = await resp.json();
          lessons.value = data;
          // 如果尚未有 selectedLesson，嘗試用 localStorage 的選項或以第一項為預設
          if (!selectedLesson.value) {
            selectedLesson.value = parsedIndex?.selectedLesson || (Array.isArray(data) && data.length ? data[0] : '第 01 課');
          }
        } catch (e) {
          console.error(e);
          window.ViewUIPlus.Message.error('載入課程列表失敗');
        }
      };

      const renderLesson = () => {
        const cardbox = document.querySelector('#cardbox');
        if (cardbox) {
          cardbox.scrollTop = 0;
        }
        cardWidth.value = cardbox.clientWidth;
        // console.log("clientWidth: " + cardbox.clientWidth)
        const titleIndex = wordList.value.findIndex(item =>
          item && Object.prototype.hasOwnProperty.call(item, 'title')
        );
        let words = [];
        if(selectedType.value == "單字") {
          if(titleIndex > -1) {
            words = wordList.value.slice(0, titleIndex)
          } else {
            words = wordList.value.slice(0)
          }
        } else if(titleIndex > -1) {
          words = wordList.value.slice(titleIndex)
        } else {
          alert("沒有補充的資料")
          return;
        }
        const renderCard = new RenderCard({
          title: selectedLesson.value,
          cardbox,
          words
        });

        renderCard.render();
        setTimeout(() => {
          let arr = document.querySelectorAll(".card");
          arr.forEach((el, index) => {
            el.addEventListener("click", () => { changeActive(el) }, false);
            el.style.cursor = "pointer";
          })
        }, 300);
        if(typeof selectedCard.value == "string") {
          let el = document.querySelector("#" + selectedCard.value);
          if (el) {
            el.classList.add("active");
            el.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'nearest' });
          }
        }
      }

      let idSpeak = null;
      const changeActive = (el, times) => {
        if(idSpeak != null) {
          clearTimeout(idSpeak);
          idSpeak = null;
        }
        if(selectedCard.value != el.id) {
          selectedCard.value = el.id;
          saveStorage();
          let arr = document.querySelectorAll(".active");
          if(arr.length > 0) {
            arr[0].classList.remove("active");
          }
          el.classList.add("active");

          // 判斷元素是否在容器内可視，如不可視則滾動到視圖
          const cardbox = document.querySelector('#cardbox');
          if (cardbox) {
            const elementRect = el.getBoundingClientRect();
            const containerRect = cardbox.getBoundingClientRect();
            
            const isVisible = (
              elementRect.top >= containerRect.top &&
              elementRect.left >= containerRect.left &&
              elementRect.bottom <= containerRect.bottom &&
              elementRect.right <= containerRect.right
            );
            
            if (!isVisible) {
              el.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'nearest' });
            }
          }
        }
        let id = el.id.replace("card", "")
        const index = wordList.value.findIndex(item =>
          item && item.id == id
        );
        let word = wordList.value[index];

        let repeat = async () => {
          idSpeak = null;
          await TTX.speak(word.kana);
          times--;
          if(times > 0) {
            idSpeak = setTimeout(async () => {
              repeat();
            }, 1000);
          }
        }
        if(typeof times == "number") {
          repeat();
        } else
          TTX.speak(word.kana)
      }

      const saveStorage = () => {
        const indexData = {
          selectedLesson: selectedLesson.value,
          selectedType: selectedType.value,
          selectedCard: selectedCard.value
        };
        window.localStorage.setItem('大家的日本語-index', JSON.stringify(indexData));
      };

      const onLessonChange = async () => {
        selectedCard.value = null;
        saveStorage();
        await loadLesson();
      };

      const onTypeChange = (value) => {
        selectedType.value = value;
        selectedCard.value = null;
        saveStorage();
        renderLesson();
      };

      const printLessonA4 = () => { // 列印
        printLesson("A4");
      }
      const printLessonA5 = () => { // 列印
        printLesson("A5");
      }
      const printLesson = (size) => { // 列印
        if(isSafariBrowser()) {
          alert("請到 Chrome 上列印")
        }
        const renderCard = new RenderCard({
          title: selectedLesson.value,
          A4: size == "A4" ? true : undefined,
          A5: size == "A5" ? true : undefined,
          words: wordList.value 
        })

        let width = document.body.clientWidth * 0.8;
        let height = document.body.clientHeight * 0.9;

        const printWindow = window.open('', '_blank', `width=${width},height=${height}`);
        if (!printWindow) {
          alert("無法開啟列印視窗，請確認是否被瀏覽器的彈出視窗阻擋功能封鎖！");
          return;
        }
        // 將處理好的 HTML 寫入新視窗
        printWindow.document.open();
        printWindow.document.write(renderCard.generate());
        printWindow.document.close();

        // 等待列印視窗資源載入完成後觸發列印
        printWindow.onload = function() {
          // 給予 250ms 延遲確保字型與圖片渲染完成
          setTimeout(() => {
            printWindow.print();
            printWindow.close(); // 列印對話框關閉後關閉該新視窗
          }, 250);
        };

      };

      onMounted(async () => {
        if (TTX) {
          await TTX.initial();
        }
        await loadLessons();
        window.addEventListener('resize', onResize);
        window.addEventListener('keydown', onKeyDown);
        await loadLesson();
      });

      onBeforeUnmount(() => {
        window.removeEventListener('resize', onResize);
        window.removeEventListener('keydown', onKeyDown);
      });

      return {
        selectedLesson,
        lessons,
        selectedType,
        wordList,
        loading,
        cardWidth,
        loadLessons,
        loadLesson,
        renderLesson,
        onLessonChange,
        onTypeChange,
        printLesson,
        printLessonA4,
        printLessonA5,
        changeActive
      };
    }
  });

  // 載入繁體中文語言包
  app.use(window.ViewUIPlus, {
    locale: zhTW
  });

  app.mount('#app');

  // 保留原有的 window.onload 邏輯與測試用函數
  window.onload = async function(){
		let email =  window.localStorage["email"];
		let password = window.localStorage["password"];
		if(location.href.indexOf("?") > -1) {
			let s = location.href.substr(location.href.indexOf("?") + 1);
			let arr = s.split("&");
      for (let index = 0; index < arr.length; index++) {
        const element = arr[index].split("=");
        window.localStorage[element[0]] = element[1];
      }
		}

    if(typeof window.localStorage["email"] == "string" && window.localStorage["email"].length > 0 ) {
			try {
				FireStore.initial();
				await FireStore.signIn()
				console.log("FireStore.mail: " + FireStore.mail() + "\n  id: " + FireStore.uid())

        // FireStore.setSetting("test", {a: 1, b: 2});
        // await setData("lesson", {a: 1, b: 2});
        // let result = await getData("lesson");
        // console.log("getData: " + JSON.stringify(result));
			} catch(e) {
				console.log(e)
				alert(e.message);
			}
		}
  }

  async function getData(key){ //測試用
    try {
      let snapshot1 = await FireStore.db.collection("japan").doc(key)
        .get();
      return snapshot1.data();
    } catch(e) {
      // console.log(e)
    }
  }

  async function setData(key, json){ //測試用
    let ref = FireStore.db.collection("japan").doc(key);
    try {
      let x = await ref.set(json,{merge: true});
      console.log("setData: " + JSON.stringify(x));
      return x;
    } catch(e) {
      console.log(e)
      throw e;
    }
  }
</script>
</html>
